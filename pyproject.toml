[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentics-toolkit"
version = "0.1.0"
description = "Reusable agent skills, review roles, maintenance workflows, and managed Codex installation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["requests"]

[project.optional-dependencies]
test = ["PyYAML"]

[project.scripts]
agentics = "agentics_tools.cli:main"

[project.urls]
Homepage = "https://github.com/aaronspindler/agentics"

[tool.hatch.build.targets.wheel]
packages = ["src/agentics_tools"]

[tool.hatch.build.targets.wheel.force-include]
"catalog.json" = "agentics_tools/data/catalog.json"
"skills" = "agentics_tools/data/skills"
"agents" = "agentics_tools/data/agents"
"workflows" = "agentics_tools/data/workflows"
"references" = "agentics_tools/data/references"

[tool.hatch.build.targets.sdist]
include = ["src/", "skills/", "agents/", "workflows/", "references/", "tests/", "catalog.json", "pyproject.toml", "README.md", "LICENSE"]
